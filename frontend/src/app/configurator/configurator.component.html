<div #configurationModal class="container">
  <div class="content">
    <form #configurationForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="baseUrl">Server URL</label>
        <input type="text" class="form-control" id="baseUrl" name="baseUrl" [(ngModel)]="baseUrl" required />
      </div>
      <div class="form-group">
        <label for="listId">List id</label>
        <input type="text" class="form-control" id="listId" name="listId" [(ngModel)]="listId" required />
      </div>
      <div class="form-group">
        <label for="code">Code</label>
        <input type="text" class="form-control" id="code" name="code" [(ngModel)]="code" required />
      </div>
      <div class="zoom-controls">
        <label>Zoom Level: {{ (zoomLevel || 1.0).toFixed(1) }}x</label>
        <div class="zoom-buttons">
          <button class="default-button" type="button" (click)="zoomOut()">-</button>
          <button class="default-button" type="button" (click)="resetZoom()">Reset</button>
          <button class="default-button" type="button" (click)="zoomIn()">+</button>
        </div>
      </div>
      <div class="button-group">
        <button class="default-button" type="button" (click)="close()">Cancel</button>
        <button class="default-button" type="submit">Apply</button>
      </div>
    </form>
  </div>
</div>
