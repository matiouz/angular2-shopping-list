<!DOCTYPE html>
<html>
<head>
    <title>Zoom Fix Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .test-element {
            width: 10em;
            height: 2em;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            margin: 1em 0;
            padding: 0.5em;
        }
        .controls {
            margin: 1em 0;
        }
        button {
            padding: 0.5em 1em;
            margin: 0 0.5em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Zoom Fix Test</h1>
    <p>Current zoom level: <span id="zoomLevel">1.0</span>x</p>
    
    <div class="controls">
        <button onclick="zoomOut()">Zoom Out</button>
        <button onclick="resetZoom()">Reset</button>
        <button onclick="zoomIn()">Zoom In</button>
    </div>
    
    <div class="test-element">
        This element should scale with zoom level
    </div>
    
    <script>
        // Test the safe access pattern
        let zoomLevel = undefined;
        
        function testSafeAccess() {
            // This should not throw an error
            const displayValue = (zoomLevel || 1.0).toFixed(1);
            console.log('Safe access result:', displayValue);
            return displayValue;
        }
        
        // Initialize
        zoomLevel = 1.0;
        console.log('Initial safe access:', testSafeAccess());
        
        // Test with undefined
        zoomLevel = undefined;
        console.log('Undefined safe access:', testSafeAccess());
        
        // Test with actual zoom functionality
        zoomLevel = 1.0;
        
        function zoomIn() {
            zoomLevel = Math.min(zoomLevel + 0.1, 2.0);
            applyZoom();
        }
        
        function zoomOut() {
            zoomLevel = Math.max(zoomLevel - 0.1, 0.5);
            applyZoom();
        }
        
        function resetZoom() {
            zoomLevel = 1.0;
            applyZoom();
        }
        
        function applyZoom() {
            document.documentElement.style.fontSize = `${zoomLevel * 100}%`;
            document.getElementById('zoomLevel').textContent = (zoomLevel || 1.0).toFixed(1);
        }
        
        // Initialize
        applyZoom();
    </script>
</body>
</html>
